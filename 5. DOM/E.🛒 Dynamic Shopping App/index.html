<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Shopping App</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- SHOPPING APP -->
     <main class="container">

        <h1>🛒 Shopping List</h1>

        <!-- Input Area -->
        <div class="input-area">

            <input 
            id="ProductInput"
            type="text"
            placeholder="Enter a product"
            >

            <button id="addButton">
                Add Product
            </button>

        </div>

        <!-- Product will be create here -->
         <ul id="productList"></ul>

     </main>

    <!-- Connect JavaScript -->
    <script src="main.js"></script>

</body>

</html>
